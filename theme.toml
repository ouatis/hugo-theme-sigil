name = "Sigil"
license = "MIT"
licenselink = "https://github.com/ouatis/hugo-theme-sigil/blob/main/LICENSE"
description = "A literary Hugo theme — ink, paper, and everything in threes. Vermilion, ink-green and amber on old paper; margin sidenotes, full-text RSS and a font-subsetting pipeline. Based on PaperMod."
homepage = "https://github.com/ouatis/hugo-theme-sigil"
demosite = "https://ouatis.com/hugo-theme-sigil/"
tags = ["blog", "literary", "minimal", "dark", "light", "multilingual", "typography", "paper", "search"]
features = [
  "sidenotes (tufte-style margin footnotes)",
  "full-text RSS",
  "font subsetting pipeline (build-fonts.sh)",
  "dark & light modes",
  "on-the-fly search (fuse)",
  "archives, taxonomies, breadcrumbs",
  "multilingual (zh/en/ja built in)",
  "paper grain, colophon footer, hover-synced seal",
]
min_version = "0.156.0"

[author]
  name = "SigiL"
  homepage = "/"
