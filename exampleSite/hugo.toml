baseURL = "https://example.org/"
title = "SIGIL"
theme = "hugo-theme-sigil"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    label = "English"
    weight = 1
    title = "SIGIL"
    [languages.en.params]
      [languages.en.params.homeInfoParams]
        content = "A restrained literary theme for Hugo — paper, ink, and everything in threes. Long-form essays, research notes, and reading logs, set for the page rather than the feed."

    [[languages.en.menus.main]]
        identifier = "typography"
        name = "Typography"
        pageRef = "posts/typography"
    [[languages.en.menus.main]]
        identifier = "archives"
        name = "Archives"
        pageRef = "archives"
    [[languages.en.menus.main]]
        identifier = "docs"
        name = "Docs"
        pageRef = "docs"
    [[languages.en.menus.main]]
        identifier = "about"
        name = "About"
        pageRef = "about"
    [[languages.en.menus.main]]
        identifier = "search"
        name = "Search"
        pageRef = "search"

  [languages.zh-cn]
    locale = "zh-CN"
    label = "简体中文"
    weight = 2
    title = "SIGIL"
    [languages.zh-cn.params]
      [languages.zh-cn.params.homeInfoParams]
        content = "一个克制的 Hugo 文学主题——纸、墨，万物成三。长文、研究笔记与阅读札记，为纸面而排，不为信息流。"
    [[languages.zh-cn.menus.main]]
        identifier = "typography"
        name = "排版"
        pageRef = "posts/typography"
    [[languages.zh-cn.menus.main]]
        identifier = "archives"
        name = "归档"
        pageRef = "archives"
    [[languages.zh-cn.menus.main]]
        identifier = "docs"
        name = "文档"
        pageRef = "docs"
    [[languages.zh-cn.menus.main]]
        identifier = "about"
        name = "关于"
        pageRef = "about"
    [[languages.zh-cn.menus.main]]
        identifier = "search"
        name = "搜索"
        pageRef = "search"

  [languages.ja]
    locale = "ja"
    label = "日本語"
    weight = 3
    title = "SIGIL"
    [languages.ja.params]
      [languages.ja.params.homeInfoParams]
        content = "Hugo の控えめな文学テーマ——紙とインク、三つ組。長文、研究ノート、読書録。フィードではなく、紙面のために組む。"
    [[languages.ja.menus.main]]
        identifier = "typography"
        name = "組版"
        pageRef = "posts/typography"
    [[languages.ja.menus.main]]
        identifier = "archives"
        name = "アーカイブ"
        pageRef = "archives"
    [[languages.ja.menus.main]]
        identifier = "docs"
        name = "ドキュメント"
        pageRef = "docs"
    [[languages.ja.menus.main]]
        identifier = "about"
        name = "About"
        pageRef = "about"
    [[languages.ja.menus.main]]
        identifier = "search"
        name = "検索"
        pageRef = "search"

[params]
  mainSections = ["posts"]
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowTotalWords = true
  hideSummary = true
  ShowToc = true
  TocOpen = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ogAutoCard = true
  # 内附字体只覆盖拉丁字母;不配的话中日文标题在 OG 卡片上是豆腐块
  # ——分享到社交平台时读者第一眼就是那行空框。子集只含 demo 实际出现
  # 的 42 个非拉丁字加拉丁基本集,57KB;来源 Noto Serif SC,OFL 1.1。
  ogCardFont = "og/plex-serif-cjk-subset.ttf"
  # demo 托管在 ouatis.com 子目录下,不进搜索引擎索引
  robotsNoIndex = true

  # ===== 首页 Hero:整块全部可选,删掉任何一行都不会留下空容器 =====
  # sgKicker:标题上方的小号字。留空则不渲染该元素(不是渲染一个空 <p>)
  sgKicker = "A Hugo theme"
  # sgHomeTitle:首页大标题。留空则回退 site.Title
  sgHomeTitle = "Notes from the Margins"
  # sgSealImage:朱砂印章图。留空则回退 ∴ 字符(2026-10 起是一枚会看的 SVG 眼睛)。
  # 路径相对 static/,写 "/images/seal.png" 即指向 static/images/seal.png
  # sgSealImage = "/images/seal.png"
  # homePageSize:首页每页篇数。不设则用全站 paginate;设 0 同样视为不设
  homePageSize = 10

  # ===== 三态状态条:每 6 秒轮换一条,尊重 prefers-reduced-motion =====
  # 示例内容,展示 SIGIL 适合的场景(数字花园/阅读笔记/文化评论)。
  # 均为虚构示例,非真实站点数据;sgDaysInCage("Day N in the Cage")属个人站点
  # 计数,不适合公开 demo,故不设。
  # 任何一项删掉都不渲染;全删则整条状态条(含轮换脚本)都不出现。
  sgMotto = "Ink, paper, and everything in threes."
  sgReading = "The Book of Disquiet"
  sgListening = "An Anthology of Ambient Works"
  sgWatching = "Stalker, again"
  sgPlaying = "Disco Elysium"
  sgWriting = "a long essay on marginalia"
  sgExploring = "typography and the digital garden"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ouatis/hugo-theme-sigil"

# ===== 客户端搜索 =====
# home 输出必须含 "JSON":/index.json 是 Fuse.js 的索引源,缺了它 search 页
# 只有壳没有数据。搜索本体(fuse.basic.min.js + fastsearch.js)由主题内置,
# 页面判定认 layout == "search"(菜单项 pageRef 指向 search 页即可)。
[outputs]
  home = ["HTML", "RSS", "JSON", "JSONFeed", "LLMSTXT"]

# Fuse.js 检索参数;键名对应 front matter 字段。
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  minMatchCharLength = 2
  findAllMatches = true
  threshold = 0.2
  distance = 100
  ignoreLocation = true
  keys = ["title", "summary", "content", "tags"]

[markup]
  [markup.goldmark]
    # Tufte 侧边注依赖 markdown 里的原生 HTML(脚注由脚本克隆到右栏),
    # 因此 unsafe 必须为 true;关掉它侧边注会退化成行内文字。
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        inline = [['\(', '\)']]
        block = [['$$', '$$'], ['\[', '\]']]
  [markup.highlight]
    # 主题自带 Catppuccin Macchiato 的 chroma class 样式,走 class 模式
    noClasses = false
