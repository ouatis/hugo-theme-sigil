baseURL = "https://example.com/"
title = "Sigil 示例志"
theme = "hugo-theme-sigil"

defaultContentLanguage = "zh-cn"

[languages]
  [languages.zh-cn]
    label = "中文"
    weight = 1
    title = "Sigil 示例志"
    [languages.zh-cn.params]
      sgKicker = "A LITERARY ARCHIVE"
      sgColophon = "MADE WITH INK & PAPER"
      [languages.zh-cn.params.homeInfoParams]
        content = "一个基于 Sigil 主题的示例站点。写作、翻译，以及其他。"

    [[languages.zh-cn.menus.main]]
        identifier = "about"
        name = "关于"
        url = "/about/"
    [[languages.zh-cn.menus.main]]
        identifier = "archives"
        name = "归档"
        url = "/archives/"
    [[languages.zh-cn.menus.main]]
        identifier = "categories"
        name = "分类"
        url = "/categories/"
    [[languages.zh-cn.menus.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags/"
    [[languages.zh-cn.menus.main]]
        identifier = "search"
        name = "搜索"
        url = "/search/"

[params]
  mainSections = ["posts"]
  author = "SigiL"
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowWordCount = true
  hideSummary = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com"

  [params.assets]
    theme_color = "#f4f6f3"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [languages.en]
    label = "English"
    weight = 2
    title = "Sigil Demo"
    [languages.en.params]
      sgKicker = "A LITERARY ARCHIVE"
      sgColophon = "MADE WITH INK & PAPER"
      [languages.en.params.homeInfoParams]
        content = "A demo site built with the Sigil theme. Writing, translation, and other things."

    [[languages.en.menus.main]]
        identifier = "about"
        name = "About"
        url = "/en/about/"
    [[languages.en.menus.main]]
        identifier = "archives"
        name = "Archives"
        url = "/en/archives/"
    [[languages.en.menus.main]]
        identifier = "search"
        name = "Search"
        url = "/en/search/"
