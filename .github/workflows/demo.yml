name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build font subsets for the demo
        run: |
          ln -s exampleSite/content content
          pip install "fonttools[woff]"
          scripts/build-fonts.sh
          mkdir -p exampleSite/static
          cp -r static/fonts exampleSite/static/fonts

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build example site
        run: |
          mkdir -p /tmp/hugo-themes
          ln -s "$GITHUB_WORKSPACE" /tmp/hugo-themes/hugo-theme-sigil
          hugo --source exampleSite --themesDir /tmp/hugo-themes --baseURL "https://ouatis.com/hugo-theme-sigil/" --destination public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
