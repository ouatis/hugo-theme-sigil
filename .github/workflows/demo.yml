name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Cache IBM Plex source
        uses: actions/cache@v4
        with:
          path: .cache/ibm-plex
          key: ibm-plex-1.1.0

      - name: Install font tooling
        run: python3 -m pip install --quiet fonttools brotli

      - name: Build font subsets for the demo
        run: |
          scripts/build-fonts.sh corpus
          mkdir -p exampleSite/static
          cp -r static/fonts exampleSite/static/fonts

      - name: Verify build (check.sh — blocks deploy on failure)
        run: bash scripts/check.sh

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build example site
        run: |
          mkdir -p /tmp/hugo-themes
          ln -s "$GITHUB_WORKSPACE" /tmp/hugo-themes/hugo-theme-sigil
          hugo --source exampleSite --themesDir /tmp/hugo-themes --baseURL "https://ouatis.com/hugo-theme-sigil/" --destination public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 清扫历史运行,只留当前——Actions 页面单条滚动
      # 只扫本工作流:仓库还有 install-modes 等,全局清扫会竞态删除它们的运行
      - name: Prune old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=${{ github.run_id }}
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" --paginate \
            --jq '.workflow_runs[] | select(.name == "Demo") | select(.id != '"$KEEP"') | select(.status == "completed") | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" > /dev/null 2>&1 || true
            done

      # 部署失败时开/续写工单,成功后自动关闭——红色运行不等于有人看见
      - name: Close failure ticket on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "Demo 部署失败 in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "${{ github.repository }}" --comment "最近一次 Demo 部署成功，本工单自动关闭。"
          fi

      - name: Report failure as issue
        # 放在最后并 gate 在 failure() 上:任何一步失败都会落到工单里
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "Demo 部署失败 in:title" --json number --jq '.[0].number // empty')
          BODY="Demo 部署在 $(date -u '+%Y-%m-%d %H:%M UTC') 失败。
          运行日志: ${RUN_URL}
          下次推送 main 或手动运行成功后本工单自动关闭。"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "🔴 Demo 部署失败（自动工单）" --body "$BODY"
          fi
