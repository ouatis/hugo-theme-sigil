name: Install modes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-modes
  cancel-in-progress: true

jobs:
  submodule:
    name: submodule install
    runs-on: ubuntu-latest
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Scratch site consumes this repo as a submodule
        run: |
          hugo new site modtest
          cd modtest
          git init -q
          git submodule add https://github.com/ouatis/hugo-theme-sigil themes/hugo-theme-sigil
          cp -r themes/hugo-theme-sigil/exampleSite/content/* content/
          printf 'theme = "hugo-theme-sigil"\n' >> hugo.toml
          hugo --destination public
          test -f public/index.html

  module:
    name: hugo modules install
    runs-on: ubuntu-latest
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Scratch site consumes this repo as a Hugo module
        run: |
          hugo new site modtest
          cd modtest
          hugo mod init example.com/modtest
          printf 'theme = ["github.com/ouatis/hugo-theme-sigil"]\n' >> hugo.toml
          hugo mod get github.com/ouatis/hugo-theme-sigil
          # exampleSite/ 被 Hugo 模块机制排除,这里用一篇样例文验证渲染
          mkdir -p content/posts
          printf -- '---\ntitle: "Hello from the install test"\n---\n\nIt renders.\n' > content/posts/hello.md
          hugo --destination public
          test -f public/posts/hello/index.html

  # A clean install must ship CSS whose @import targets all exist in the
  # repo. sc/ and jp/ are gitignored — they are generated by build-fonts.sh
  # corpus, never committed — so result.css committed with a corpus import
  # 404s for every submodule/Hugo-modules user who has not run the build.
  # The Demo workflow builds fonts first and so never sees this; the install
  # jobs above only check that Hugo renders, not that CSS resolves. This job
  # walks every committed CSS file, follows its @import chain, and fails if
  # any referenced file is missing from the checkout. That regression shipped
  # twice (4240c94 fixed it, a later font regen reintroduced it), so gate it
  # here rather than rely on review.
  resource-integrity:
    name: committed CSS resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every CSS @import target exists in the checkout
        run: |
          python3 - <<'PY'
          import os, re, sys

          root = "static/fonts"
          missing = []
          checked = set()

          def imports_of(path):
              css = open(path, encoding="utf-8").read()
              return re.findall(r'@import\s+url\(["\']?([^"\')]+)["\']?\)', css)

          def walk(path):
              if path in checked or not os.path.exists(path):
                  return
              checked.add(path)
              for imp in imports_of(path):
                  target = os.path.normpath(os.path.join(os.path.dirname(path), imp))
                  if not os.path.exists(target):
                      missing.append((path, imp, target))
                  else:
                      walk(target)

          for dirpath, _, files in os.walk(root):
              for f in files:
                  if f.endswith(".css"):
                      walk(os.path.join(dirpath, f))

          if missing:
              for src, imp, target in missing[:10]:
                  print(f"FAIL: {src} imports {imp} -> {target} (not in repo)")
              print(f"{len(missing)} missing CSS import target(s); "
                    f"sc/ and jp/ are gitignored build output — the committed "
                    f"result.css must stay Latin-only")
              sys.exit(1)
          print(f"OK: {len(checked)} CSS files, every @import target present")
          PY
